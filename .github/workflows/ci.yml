# AgentFleet CI of the fork (specification §7.1, §7.2): source integrity and
# strict typecheck. GitHub-hosted runners only, actions pinned by SHA,
# read-only token, no secret. Documented in docs/agentfleet/CI.md.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

jobs:
  source-integrity:
    name: source-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pinned pnpm (packageManager)
        run: |
          corepack enable pnpm
          expected="$(node -p "require('./package.json').packageManager")"
          actual="pnpm@$(pnpm --version)"
          echo "packageManager=$expected pnpm=$actual node=$(node --version)"
          test "$actual" = "$expected"

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Working tree unchanged by the install
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf 'Files changed or generated by the install:\n%s\n' "$status"
            exit 1
          fi

      - name: upstream-version.json
        run: |
          jq -e '
            .repository == "https://github.com/paperclipai/paperclip"
            and (.commit | test("^[0-9a-f]{40}$"))
            and (.syncedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
          ' upstream-version.json
          commit="$(jq -r .commit upstream-version.json)"
          git merge-base --is-ancestor "$commit" HEAD

      - name: Node version policy
        run: pnpm check:node-version

      - name: Dockerfile deps stage
        run: node ./scripts/check-docker-deps-stage.mjs

      - name: Forbidden tokens
        run: pnpm check:tokens

      - name: No git push in adapter and runtime code
        run: |
          node ./scripts/check-no-git-push.mjs
          node --test ./scripts/check-no-git-push.test.mjs

      - name: Feature module boundaries
        run: |
          pnpm check:module-boundaries
          node --test ./scripts/check-module-boundaries.test.mjs

      - name: Migration ordering against the target branch
        if: github.event_name == 'pull_request'
        run: >-
          node .github/scripts/check-pr-migration-order.mjs
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pinned pnpm (packageManager)
        run: corepack enable pnpm

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      # Every workspace package's own strict typecheck, including the builds
      # it depends on (plugin SDK, runner vendor bundle, Rust cargo check).
      - name: Typecheck
        run: pnpm typecheck
