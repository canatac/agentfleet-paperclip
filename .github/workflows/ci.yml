# AgentFleet CI of the fork (specification §7.1, §7.2): source integrity,
# strict typecheck, the AgentFleet tests and the upstream regression suites.
# GitHub-hosted runners only, actions pinned by SHA, read-only token, no
# secret. Documented in docs/agentfleet/CI.md.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual run, for example on main after a repository setting change.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

jobs:
  source-integrity:
    name: source-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pinned pnpm (packageManager)
        run: |
          corepack enable pnpm
          expected="$(node -p "require('./package.json').packageManager")"
          actual="pnpm@$(pnpm --version)"
          echo "packageManager=$expected pnpm=$actual node=$(node --version)"
          test "$actual" = "$expected"

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Working tree unchanged by the install
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf 'Files changed or generated by the install:\n%s\n' "$status"
            exit 1
          fi

      - name: upstream-version.json
        run: |
          jq -e '
            .repository == "https://github.com/paperclipai/paperclip"
            and (.commit | test("^[0-9a-f]{40}$"))
            and (.syncedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
          ' upstream-version.json
          commit="$(jq -r .commit upstream-version.json)"
          git merge-base --is-ancestor "$commit" HEAD

      - name: Node version policy
        run: pnpm check:node-version

      - name: Dockerfile deps stage
        run: node ./scripts/check-docker-deps-stage.mjs

      - name: Forbidden tokens
        run: pnpm check:tokens

      - name: No git push in adapter and runtime code
        run: |
          node ./scripts/check-no-git-push.mjs
          node --test ./scripts/check-no-git-push.test.mjs

      - name: Feature module boundaries
        run: |
          pnpm check:module-boundaries
          node --test ./scripts/check-module-boundaries.test.mjs

      - name: Migration ordering against the target branch
        if: github.event_name == 'pull_request'
        run: >-
          node .github/scripts/check-pr-migration-order.mjs
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pinned pnpm (packageManager)
        run: corepack enable pnpm

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      # Every workspace package's own strict typecheck, including the builds
      # it depends on (plugin SDK, runner vendor bundle, Rust cargo check).
      - name: Typecheck
        run: pnpm typecheck

  # The external run id tests (docs/agentfleet/TEST_STRATEGY.md). The server
  # suites start an embedded PostgreSQL, which only runs as a non-root user
  # (the runner user); when it cannot start they are skipped, so the job
  # fails on any skipped, todo or failed test.
  agentfleet-tests:
    name: agentfleet-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pinned pnpm (packageManager)
        run: corepack enable pnpm

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Hermes adapter unit tests
        working-directory: packages/adapters/hermes
        run: >-
          pnpm exec vitest run
          --reporter=default --reporter=json
          --outputFile="$RUNNER_TEMP/vitest-hermes-adapter.json"

      - name: External run id tests (heartbeat, fake Hermes gateway, PostgreSQL, API)
        working-directory: server
        run: >-
          pnpm exec vitest run
          src/__tests__/heartbeat-external-run-id
          src/__tests__/hermes-gateway-external-run-id.integration.test.ts
          --reporter=default --reporter=json
          --outputFile="$RUNNER_TEMP/vitest-server-external-run-id.json"

      - name: No skipped, todo or failed test
        run: |
          for report in "$RUNNER_TEMP"/vitest-*.json; do
            jq -c '{report: input_filename, total: .numTotalTests, passed: .numPassedTests, failed: .numFailedTests, skipped: .numPendingTests, todo: .numTodoTests}' "$report"
            jq -e '.numTotalTests > 0 and .numFailedTests == 0 and .numPendingTests == 0 and .numTodoTests == 0' "$report" >/dev/null
          done

  # The upstream regression suites (docs/agentfleet/CI.md), in the lots of the
  # upstream PR workflow. scripts/run-vitest-stable.mjs selects the suites of
  # each lot; scripts/agentfleet/run-regression.mjs runs them and fails on any
  # failed, skipped or todo test outside the exceptions approved in
  # scripts/agentfleet/regression-policy.json.
  regression-lot:
    name: regression (${{ matrix.lot }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lot:
          - general-server:1/5
          - general-server:2/5
          - general-server:3/5
          - general-server:4/5
          - general-server:5/5
          - general-workspaces-a:1/2
          - general-workspaces-a:2/2
          - general-workspaces-b
          - serialized:1/5
          - serialized:2/5
          - serialized:3/5
          - serialized:4/5
          - serialized:5/5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pinned pnpm (packageManager)
        run: corepack enable pnpm

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Regression lot
        env:
          LOT: ${{ matrix.lot }}
        run: node scripts/agentfleet/run-regression.mjs --lot "$LOT" --report-dir "$RUNNER_TEMP/regression"

      - name: Keep the Vitest reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-reports-${{ strategy.job-index }}
          path: ${{ runner.temp }}/regression
          retention-days: 14
          if-no-files-found: warn

  # One check for the ruleset: every regression lot passed.
  regression:
    name: regression
    needs: regression-lot
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every regression lot passed
        env:
          RESULT: ${{ needs.regression-lot.result }}
        run: |
          echo "regression lots: $RESULT"
          test "$RESULT" = "success"
