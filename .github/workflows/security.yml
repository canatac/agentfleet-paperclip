# Security checks of the AgentFleet fork (specification §7.2 "security", §14):
# the secret scan of the tracked tree and of the AgentFleet history, and the
# audit report of the production dependencies.
# GitHub-hosted runner, actions pinned by SHA, read-only token, no secret.
# Documented in docs/agentfleet/CI.md.
name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The full history: the scan covers every commit since the upstream
      # base commit of upstream-version.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks (pinned version, verified checksum)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Secret scan (tree, reviewed findings, canary, AgentFleet history)
        run: scripts/agentfleet/check-secrets.sh "$RUNNER_TEMP/gitleaks"

  # Report only (operator decision, paperclip-fleet#73): the known
  # vulnerabilities of the production dependencies, by severity, with the high
  # and critical ones in detail. New ones are blocked on each pull request by
  # dependency-review.yml.
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pinned pnpm (packageManager)
        run: corepack enable pnpm

      # The install lets pnpm audit name the path of each vulnerable package.
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Audit of the production dependencies (report only)
        run: node scripts/agentfleet/report-audit.mjs --json "$RUNNER_TEMP/dependency-audit.json"

      - name: Keep the audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit.json
          retention-days: 14
