# Manual performance candidate. Existing workflows stay unchanged.
name: ci-candidate
'on':
  workflow_dispatch:
    inputs:
      comparison_base:
        description: Immutable baseline commit for promotion/migration checks (40 hex)
        required: true
        type: string
        default: 8224c4620a55e6174c6ac9388f2eaccf7ddcf9c3
permissions:
  contents: read
concurrency:
  group: ci-candidate-${{ github.ref }}
  cancel-in-progress: false
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
jobs:
  source-integrity:
    name: candidate / source-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Validate comparison baseline
      env:
        BASE_SHA: ${{ inputs.comparison_base }}
      run: |-
        [[ $BASE_SHA =~ ^[0-9a-f]{40}$ ]]
        git cat-file -e "$BASE_SHA^{commit}"
        git merge-base --is-ancestor "$BASE_SHA" HEAD
    - name: Pinned dependencies with candidate-only cache
      uses: ./.github/actions/agentfleet-deps-candidate
    - name: Working tree unchanged by the install
      run: |
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          printf 'Files changed or generated by the install:\n%s\n' "$status"
          exit 1
        fi
    - name: upstream-version.json
      run: |
        jq -e '
          .repository == "https://github.com/paperclipai/paperclip"
          and (.commit | test("^[0-9a-f]{40}$"))
          and (.syncedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
        ' upstream-version.json
        commit="$(jq -r .commit upstream-version.json)"
        git merge-base --is-ancestor "$commit" HEAD
    - name: Node version policy
      run: pnpm check:node-version
    - name: Release notes script (AF-CI-003c)
      run: scripts/agentfleet/release-notes.test.sh
    - name: Dockerfile deps stage
      run: node ./scripts/check-docker-deps-stage.mjs
    - name: Forbidden tokens
      run: pnpm check:tokens
    - name: No git push in adapter and runtime code
      run: |
        node ./scripts/check-no-git-push.mjs
        node --test ./scripts/check-no-git-push.test.mjs
    - name: Feature module boundaries
      run: |
        pnpm check:module-boundaries
        node --test ./scripts/check-module-boundaries.test.mjs
    - name: Migration ordering against the target branch
      run: node .github/scripts/check-pr-migration-order.mjs "$BASE_SHA" "$GITHUB_SHA"
      env:
        BASE_SHA: ${{ inputs.comparison_base }}
    - name: Candidate workflow and command contracts
      run: node --test scripts/agentfleet/performance/*.test.mjs
  typecheck:
    name: candidate / typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Pinned dependencies with candidate-only cache
      uses: ./.github/actions/agentfleet-deps-candidate
    - name: Restore candidate typecheck Rust cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          packages/paperclip-runner/runner/target
        key: ci-candidate-cargo-v1-${{ runner.os }}-${{ runner.arch }}-typecheck-${{ hashFiles('packages/paperclip-runner/rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}-${{ hashFiles('packages/paperclip-runner/runner/**', 'packages/paperclip-runner/protocol/**') }}
        restore-keys: ci-candidate-cargo-v1-${{ runner.os }}-${{ runner.arch }}-typecheck-${{ hashFiles('packages/paperclip-runner/rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}-
    - name: Typecheck
      run: pnpm typecheck
  agentfleet-tests:
    name: candidate / agentfleet-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Pinned dependencies with candidate-only cache
      uses: ./.github/actions/agentfleet-deps-candidate
    - name: Hermes adapter unit tests
      working-directory: packages/adapters/hermes
      run: pnpm exec vitest run --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vitest-hermes-adapter.json"
    - name: External run id tests (heartbeat, fake Hermes gateway, PostgreSQL, API)
      working-directory: server
      run: pnpm exec vitest run src/__tests__/heartbeat-external-run-id src/__tests__/hermes-gateway-external-run-id.integration.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vitest-server-external-run-id.json"
    - name: Task session parameters containing NUL (AF-OBS-006, PostgreSQL)
      working-directory: server
      run: pnpm exec vitest run src/__tests__/heartbeat-task-session-nul.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vitest-server-task-session-nul.json"
    - name: Session id containing NUL (AF-OBS-007, PostgreSQL)
      working-directory: server
      run: pnpm exec vitest run src/__tests__/heartbeat-session-id-nul.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vitest-server-session-id-nul.json"
    - name: No skipped, todo or failed test
      run: |
        for report in "$RUNNER_TEMP"/vitest-*.json; do
          jq -c '{report: input_filename, total: .numTotalTests, passed: .numPassedTests, failed: .numFailedTests, skipped: .numPendingTests, todo: .numTodoTests}' "$report"
          jq -e '.numTotalTests > 0 and .numFailedTests == 0 and .numPendingTests == 0 and .numTodoTests == 0' "$report" >/dev/null
        done
  regression-lot:
    name: candidate / regression (${{ matrix.lot }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lot:
        - general-server:1/8
        - general-server:2/8
        - general-server:3/8
        - general-server:4/8
        - general-server:5/8
        - general-server:6/8
        - general-server:7/8
        - general-server:8/8
        - general-workspaces-a:1/2
        - general-workspaces-a:2/2
        - general-workspaces-b
        - serialized:1/5
        - serialized:2/5
        - serialized:3/5
        - serialized:4/5
        - serialized:5/5
        - complement
      max-parallel: 12
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Pinned dependencies with candidate-only cache
      uses: ./.github/actions/agentfleet-deps-candidate
    - name: Regression lot
      env:
        LOT: ${{ matrix.lot }}
      run: node scripts/agentfleet/run-regression.mjs --lot "$LOT" --report-dir "$RUNNER_TEMP/regression"
    - name: Keep the Vitest reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: regression-reports-${{ strategy.job-index }}
        path: ${{ runner.temp }}/regression
        retention-days: 14
        if-no-files-found: warn
  regression:
    name: candidate / regression
    needs: regression-lot
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Every regression lot passed
      env:
        RESULT: ${{ needs.regression-lot.result }}
      run: |
        echo "regression lots: $RESULT"
        test "$RESULT" = "success"
  runner-lane:
    name: candidate / runner (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Pinned dependencies with candidate-only cache
      uses: ./.github/actions/agentfleet-deps-candidate
    - name: Restore candidate Rust compilation cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          packages/paperclip-runner/runner/target
        key: ci-candidate-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ hashFiles('packages/paperclip-runner/rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}-${{ hashFiles('packages/paperclip-runner/runner/**', 'packages/paperclip-runner/protocol/**') }}
        restore-keys: ci-candidate-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ hashFiles('packages/paperclip-runner/rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}-
    - name: Pinned Runner Rust toolchain
      working-directory: packages/paperclip-runner
      run: rustup show
    - name: Verify original runner commands in an independent lane
      env:
        PAPERCLIP_FINAL_BURST_BENCHMARK: '1'
        LANE: ${{ matrix.lane }}
      run: |-
        set -o pipefail
        node scripts/agentfleet/performance/runner-lane.mjs "$LANE" 2>&1 | tee "$RUNNER_TEMP/runner-$LANE.log"
    - name: Keep runner output
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: runner-candidate-${{ matrix.lane }}
        path: ${{ runner.temp }}/runner-${{ matrix.lane }}.log
        if-no-files-found: error
        retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        lane:
        - protocol
        - rust
  runner:
    name: candidate / runner complete
    needs: runner-lane
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Both lanes passed
      env:
        RESULT: ${{ needs.runner-lane.result }}
      run: test "$RESULT" = success
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: runner-candidate-*
        path: ${{ runner.temp }}/runner-candidate
        merge-multiple: true
    - name: Original no-skips verifier on the complete output
      run: |-
        cat "$RUNNER_TEMP/runner-candidate/runner-protocol.log" "$RUNNER_TEMP/runner-candidate/runner-rust.log" > "$RUNNER_TEMP/runner-combined.log"
        node scripts/agentfleet/verify-runner-log.mjs "$RUNNER_TEMP/runner-combined.log"
  candidate-result:
    name: candidate / CI complete
    needs:
    - source-integrity
    - typecheck
    - agentfleet-tests
    - runner
    - regression
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Every required control passed
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: jq -e 'length == 5 and all(.[]; .result == "success")' <<<"$RESULTS"
